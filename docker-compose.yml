version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: winesoft_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      # To initialize multiple databases at startup, we can mount an init script
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  auth-service:
    build:
      context: .
      dockerfile: src/AuthService/WinesoftPlatform.AuthService/Dockerfile
    container_name: winesoft_auth
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=server=mysql;port=3306;database=winesoft_auth;user=root;password=rootpassword
    depends_on:
      - mysql

  inventory-service:
    build:
      context: .
      dockerfile: src/InventoryService/WinesoftPlatform.InventoryService/Dockerfile
    container_name: winesoft_inventory
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=server=mysql;port=3306;database=winesoft_inventory;user=root;password=rootpassword
    depends_on:
      - mysql

  purchase-service:
    build:
      context: .
      dockerfile: src/PurchaseService/WinesoftPlatform.PurchaseService/Dockerfile
    container_name: winesoft_purchase
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=server=mysql;port=3306;database=winesoft_purchase;user=root;password=rootpassword
      - InventoryServiceUrl=http://inventory-service:8080
    depends_on:
      - mysql
      - inventory-service

  profiles-service:
    build:
      context: .
      dockerfile: src/ProfilesService/WinesoftPlatform.ProfilesService/Dockerfile
    container_name: winesoft_profiles
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=server=mysql;port=3306;database=winesoft_profiles;user=root;password=rootpassword
    depends_on:
      - mysql

  analytics-service:
    build:
      context: .
      dockerfile: src/AnalyticsService/WinesoftPlatform.AnalyticsService/Dockerfile
    container_name: winesoft_analytics
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - InventoryServiceUrl=http://inventory-service:8080
      - PurchaseServiceUrl=http://purchase-service:8080
    depends_on:
      - inventory-service
      - purchase-service

volumes:
  mysql_data:
