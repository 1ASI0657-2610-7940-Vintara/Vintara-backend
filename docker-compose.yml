version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: winesoft_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # To initialize multiple databases at startup, we can mount an init script
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: winesoft_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:alpine
    container_name: winesoft_redis
    ports:
      - "6379:6379"

  auth-service:
    build:
      context: .
      dockerfile: src/AuthService/WinesoftPlatform.AuthService/Dockerfile
    container_name: winesoft_auth
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=server=mysql;port=3306;database=winesoft_auth;user=root;password=${MYSQL_ROOT_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - ServiceAuth__ClientId=iot-simulator
      - ServiceAuth__ClientSecret=iot-simulator-secret-key-123456
    depends_on:
      - mysql

  inventory-service:
    build:
      context: .
      dockerfile: src/InventoryService/WinesoftPlatform.InventoryService/Dockerfile
    container_name: winesoft_inventory
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=server=mysql;port=3306;database=winesoft_inventory;user=root;password=${MYSQL_ROOT_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - RabbitMq__Host=rabbitmq
    depends_on:
      - mysql
      - rabbitmq

  profiles-service:
    build:
      context: .
      dockerfile: src/ProfilesService/WinesoftPlatform.ProfilesService/Dockerfile
    container_name: winesoft_profiles
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=server=mysql;port=3306;database=winesoft_profiles;user=root;password=${MYSQL_ROOT_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
    depends_on:
      - mysql

  analytics-service:
    build:
      context: .
      dockerfile: src/AnalyticsService/WinesoftPlatform.AnalyticsService/Dockerfile
    container_name: winesoft_analytics
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - InventoryServiceUrl=http://inventory-service:8080
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Redis__Configuration=redis:6379
      - RabbitMq__Host=rabbitmq
    depends_on:
      - inventory-service
      - redis
      - rabbitmq

  gateway-service:
    build:
      context: .
      dockerfile: src/GatewayService/WinesoftPlatform.GatewayService/Dockerfile
    container_name: winesoft_gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Cors__AllowedOrigins=https://winesoft-frontend.vercel.app,https://winesoft-platform.onrender.com,http://localhost:5173
    depends_on:
      - auth-service
      - inventory-service
      - profiles-service
      - analytics-service

  iot-simulator-service:
    build:
      context: .
      dockerfile: src/IoTSimulatorService/WinesoftPlatform.IoTSimulatorService/Dockerfile
    container_name: winesoft_iot_simulator
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Simulation__InventoryServiceUrl=http://inventory-service:8080
      - Simulation__IntervalMs=5000
      - Simulation__AuthServiceUrl=http://auth-service:8080
      - Simulation__ClientId=iot-simulator
      - Simulation__ClientSecret=iot-simulator-secret-key-123456
    depends_on:
      - inventory-service
      - auth-service

volumes:
  mysql_data:
